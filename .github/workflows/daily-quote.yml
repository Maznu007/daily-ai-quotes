name: Daily AI Quote

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate quote
        run: |
          QUOTE=$(curl -s https://api.quotable.io/random | jq -r '.content + " — " + .author')
          echo "### $(date +"%Y-%m-%d")" >> quotes.md
          echo "$QUOTE" >> quotes.md
          echo "" >> quotes.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add quotes.md
          git commit -m "Added daily quote" || echo "No changes"

      - name: Push changes
        run: git push
